<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence Diagram Siswa - Upload Dokumen</title>
    <style>
        body { font-family: 'Times New Roman', Times, serif; text-align: center; margin-top: 40px; background-color: #ffffff; }
        .diagram-container { display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Sequence Diagram: Calon Siswa (4. Upload Dokumen)</h2>
    <div class="diagram-container">
        <svg width="850" height="460" viewBox="0 0 850 460" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">
            <defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="black"/></marker></defs>

            <rect x="60" y="10" width="140" height="35" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="130" y="33" font-size="14" font-weight="bold" text-anchor="middle">Calon Siswa</text>
            <rect x="310" y="10" width="140" height="35" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="380" y="33" font-size="14" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
            <rect x="570" y="10" width="140" height="35" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="640" y="33" font-size="14" font-weight="bold" text-anchor="middle">Database</text>

            <line x1="130" y1="45" x2="130" y2="430" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
            <line x1="380" y1="45" x2="380" y2="430" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
            <line x1="640" y1="45" x2="640" y2="430" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>

            <rect x="60" y="430" width="140" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="130" y="450" font-size="13" font-weight="bold" text-anchor="middle">Calon Siswa</text>
            <rect x="310" y="430" width="140" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="380" y="450" font-size="13" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
            <rect x="570" y="430" width="140" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="640" y="450" font-size="13" font-weight="bold" text-anchor="middle">Database</text>

            <line x1="130" y1="80" x2="380" y2="80" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
            <text x="255" y="73" font-size="12" text-anchor="middle">1. Akses halaman upload dokumen</text>

            <line x1="380" y1="130" x2="640" y2="130" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
            <text x="510" y="123" font-size="12" text-anchor="middle">2. Cek status dokumen</text>

            <line x1="640" y1="170" x2="380" y2="170" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
            <text x="510" y="163" font-size="12" text-anchor="middle">3. Return status</text>

            <line x1="380" y1="210" x2="130" y2="210" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
            <text x="255" y="203" font-size="12" text-anchor="middle">4. Tampilkan form upload dokumen</text>

            <line x1="130" y1="260" x2="380" y2="260" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
            <text x="255" y="253" font-size="12" text-anchor="middle">5. Upload file (KK, Akta, Ijazah)</text>

            <line x1="380" y1="310" x2="640" y2="310" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
            <text x="510" y="303" font-size="12" text-anchor="middle">6. Simpan path file dokumen ke database</text>

            <line x1="640" y1="350" x2="380" y2="350" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
            <text x="510" y="343" font-size="12" text-anchor="middle">7. Konfirmasi berhasil</text>

            <line x1="380" y1="400" x2="130" y2="400" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
            <text x="255" y="393" font-size="12" text-anchor="middle">8. Tampilkan notifikasi "Menunggu Verifikasi"</text>
        </svg>
    </div>
</body>
</html>
