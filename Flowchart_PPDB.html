<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowchart PPDB - SMP Muhammadiyah Kaliwiro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #fff; 
            color: #000;
            padding: 30px;
        }
        .page { 
            max-width: 750px; 
            margin: 0 auto 60px auto;
            text-align: center;
            page-break-after: always;
        }
        .page:last-child { page-break-after: auto; }
        h1 {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        h2 {
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }
        svg { display: block; margin: 0 auto; }
        @media print {
            body { padding: 10px; }
            .page { margin-bottom: 0; }
        }
    </style>
</head>
<body>

<!-- ======================================= -->
<!-- FLOWCHART 1: ALUR CALON SISWA           -->
<!-- ======================================= -->
<div class="page">
    <h1>Alur Pendaftaran Peserta Didik Baru</h1>
    <h2>SMP Muhammadiyah Kaliwiro</h2>

    <svg width="700" height="1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
            </marker>
        </defs>

        <!-- 1. START -->
        <ellipse cx="350" cy="32" rx="70" ry="24" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="350" y="37" text-anchor="middle" font-size="15" font-weight="bold">START</text>
        <line x1="350" y1="56" x2="350" y2="82" stroke="#000" stroke-width="1.5" marker-end="url(#arrow1)"/>

        <!-- 2. Akses Website PPDB -->
        <rect x="220" y="82" width="260" height="48" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="350" y="111" text-anchor="middle" font-size="13" font-weight="bold">Akses Website PPDB</text>
        <line x1="350" y1="130" x2="350" y2="158" stroke="#000" stroke-width="1.5" marker-end="url(#arrow1)"/>

        <!-- 3. Pengisian Formulir Pendaftaran -->
        <rect x="210" y="158" width="280" height="58" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="350" y="182" text-anchor="middle" font-size="13" font-weight="bold">Pengisian Formulir Pendaftaran</text>
        <text x="350" y="200" text-anchor="middle" font-size="11">(Data Diri, Orang Tua, Alamat, Kesehatan)</text>
        <line x1="350" y1="216" x2="350" y2="244" stroke="#000" stroke-width="1.5" marker-end="url(#arrow1)"/>

        <!-- 4. Submit Pendaftaran -->
        <rect x="220" y="244" width="260" height="48" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="350" y="273" text-anchor="middle" font-size="13" font-weight="bold">Submit Pendaftaran</text>
        <line x1="350" y1="292" x2="350" y2="320" stroke="#000" stroke-width="1.5" marker-end="url(#arrow1)"/>

        <!-- 5. Login Dashboard Siswa -->
        <rect x="220" y="320" width="260" height="48" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="350" y="349" text-anchor="middle" font-size="13" font-weight="bold">Login Dashboard Siswa</text>
        <line x1="350" y1="368" x2="350" y2="396" stroke="#000" stroke-width="1.5" marker-end="url(#arrow1)"/>

        <!-- 6. DECISION: Verifikasi Formulir -->
        <polygon points="350,396 435,452 350,508 265,452" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="350" y="448" text-anchor="middle" font-size="13" font-weight="bold">Verifikasi</text>
        <text x="350" y="464" text-anchor="middle" font-size="13" font-weight="bold">Formulir</text>

        <!-- Left branch: Revisi -->
        <line x1="265" y1="452" x2="130" y2="452" stroke="#000" stroke-width="1.5"/>
        <line x1="130" y1="452" x2="130" y2="187" stroke="#000" stroke-width="1.5"/>
        <line x1="130" y1="187" x2="210" y2="187" stroke="#000" stroke-width="1.5" marker-end="url(#arrow1)"/>
        <text x="180" y="442" text-anchor="middle" font-size="12" font-weight="bold">Revisi</text>

        <!-- Right branch: Tidak Lulus -->
        <line x1="435" y1="452" x2="540" y2="452" stroke="#000" stroke-width="1.5" marker-end="url(#arrow1)"/>
        <text x="488" y="442" text-anchor="middle" font-size="12" font-weight="bold">Tidak Lulus</text>
        <rect x="540" y="432" width="100" height="40" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="590" y="457" text-anchor="middle" font-size="12" font-weight="bold">Selesai</text>

        <!-- Down branch: Diterima -->
        <line x1="350" y1="508" x2="350" y2="542" stroke="#000" stroke-width="1.5" marker-end="url(#arrow1)"/>
        <text x="380" y="528" text-anchor="start" font-size="12" font-weight="bold">Diterima</text>

        <!-- 7. Daftar Ulang & Upload Berkas -->
        <rect x="210" y="542" width="280" height="58" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="350" y="566" text-anchor="middle" font-size="13" font-weight="bold">Daftar Ulang &amp; Upload Berkas</text>
        <text x="350" y="584" text-anchor="middle" font-size="11">(Foto, KK, Ijazah/SKL, Rapor)</text>
        <line x1="350" y1="600" x2="350" y2="628" stroke="#000" stroke-width="1.5" marker-end="url(#arrow1)"/>

        <!-- 8. DECISION: Verifikasi Berkas Daftar Ulang -->
        <polygon points="350,628 435,684 350,740 265,684" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="350" y="680" text-anchor="middle" font-size="13" font-weight="bold">Verifikasi</text>
        <text x="350" y="696" text-anchor="middle" font-size="13" font-weight="bold">Berkas</text>

        <!-- Left branch: Tidak Valid/Revisi -->
        <line x1="265" y1="684" x2="130" y2="684" stroke="#000" stroke-width="1.5"/>
        <line x1="130" y1="684" x2="130" y2="571" stroke="#000" stroke-width="1.5"/>
        <line x1="130" y1="571" x2="210" y2="571" stroke="#000" stroke-width="1.5" marker-end="url(#arrow1)"/>
        <text x="180" y="674" text-anchor="middle" font-size="12" font-weight="bold">Revisi</text>

        <!-- Down branch: Valid -->
        <line x1="350" y1="740" x2="350" y2="774" stroke="#000" stroke-width="1.5" marker-end="url(#arrow1)"/>
        <text x="380" y="760" text-anchor="start" font-size="12" font-weight="bold">Valid</text>

        <!-- 9. Cetak Bukti Pendaftaran -->
        <rect x="220" y="774" width="260" height="48" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="350" y="803" text-anchor="middle" font-size="13" font-weight="bold">Cetak Bukti Pendaftaran</text>
        <line x1="350" y1="822" x2="350" y2="850" stroke="#000" stroke-width="1.5" marker-end="url(#arrow1)"/>

        <!-- 10. Pembayaran Uang Sekolah -->
        <rect x="210" y="850" width="280" height="58" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="350" y="874" text-anchor="middle" font-size="13" font-weight="bold">Pembayaran</text>
        <text x="350" y="892" text-anchor="middle" font-size="13" font-weight="bold">Uang Sekolah</text>
        <line x1="350" y1="908" x2="350" y2="936" stroke="#000" stroke-width="1.5" marker-end="url(#arrow1)"/>

        <!-- 11. FINISH -->
        <ellipse cx="350" cy="960" rx="70" ry="24" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="350" y="965" text-anchor="middle" font-size="15" font-weight="bold">FINISH</text>
    </svg>
</div>

<div class="page">

    <svg width="700" height="1000" xmlns="http://www.w3.org/2000/svg">

            <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">

        <!-- 1. START -->

        <text x="600" y="469" text-anchor="middle" font-size="12" font-weight="bold">Selesai</text>

        <line x1="100" y1="612" x2="100" y2="340" stroke="#000" stroke-width="1.5"/>
        <line x1="100" y1="340" x2="220" y2="340" stroke="#000" stroke-width="1.5" marker-end="url(#arrow2)"/>
        <text x="180" y="602" text-anchor="middle" font-size="12" font-weight="bold">Revisi Berkas</text>

        <text x="380" y="692" text-anchor="start" font-size="12" font-weight="bold">Lengkap</text>

        <!-- 8. Kelola Siswa Aktif -->

        <text x="350" y="746" text-anchor="middle" font-size="11">(Tambah Manual / Import Excel)</text>
        <line x1="350" y1="762" x2="350" y2="790" stroke="#000" stroke-width="1.5" marker-end="url(#arrow2)"/>

        <!-- 9. Export Data -->
        <rect x="220" y="790" width="260" height="48" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>

        <line x1="350" y1="838" x2="350" y2="866" stroke="#000" stroke-width="1.5" marker-end="url(#arrow2)"/>

        <!-- 10. Kelola Konten, FAQ, Pesan -->

        <text x="350" y="890" text-anchor="middle" font-size="13" font-weight="bold">Kelola Konten Website</text>
        <text x="350" y="908" text-anchor="middle" font-size="11">(FAQ, Berita, Pesan Masuk)</text>
        <line x1="350" y1="924" x2="350" y2="952" stroke="#000" stroke-width="1.5" marker-end="url(#arrow2)"/>

        <!-- 11. FINISH -->
        <ellipse cx="350" cy="976" rx="70" ry="24" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="350" y="981" text-anchor="middle" font-size="15" font-weight="bold">FINISH</text>
    </svg>
</div>
