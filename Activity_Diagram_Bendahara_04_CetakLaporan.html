<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Diagram Bendahara - Cetak Laporan</title>
    <style>
        body { font-family: 'Times New Roman', Times, serif; text-align: center; margin-top: 50px; background-color: #ffffff; }
        .diagram-container { display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Activity Diagram: Bendahara (4. Cetak Laporan Keuangan)</h2>
    <div class="diagram-container">
        <svg width="800" height="470" viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">
            <rect x="0" y="0" width="800" height="470" fill="none" stroke="black" stroke-width="2"/>
            <line x1="0" y1="60" x2="800" y2="60" stroke="black" stroke-width="2"/>
            <line x1="400" y1="0" x2="400" y2="470" stroke="black" stroke-width="2"/>
            <text x="200" y="38" font-size="18" font-weight="bold" text-anchor="middle">Bendahara</text>
            <text x="600" y="38" font-size="18" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
            <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="black" /></marker></defs>

            <circle cx="200" cy="110" r="16" fill="black"/>
            
            <rect x="60" y="170" width="280" height="40" rx="20" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="200" y="195" font-size="14" text-anchor="middle">Pilih Menu Rekapitulasi Keuangan</text>
            
            <rect x="460" y="250" width="280" height="40" rx="20" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="600" y="275" font-size="14" text-anchor="middle">Hitung Total Pendapatan</text>

            <rect x="460" y="330" width="280" height="40" rx="20" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="600" y="355" font-size="14" text-anchor="middle">Render Laporan Rekapitulasi PDF</text>

            <circle cx="600" cy="420" r="14" fill="white" stroke="black" stroke-width="2"/>
            <circle cx="600" cy="420" r="8" fill="black"/>
            
            <line x1="200" y1="126" x2="200" y2="170" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <path d="M 340 190 L 600 190 L 600 250" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <line x1="600" y1="290" x2="600" y2="330" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <line x1="600" y1="370" x2="600" y2="406" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
        </svg>
    </div>
</body>
</html>
