<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence Diagram Siswa - Login</title>
    <style>
        body { font-family: 'Times New Roman', Times, serif; text-align: center; margin-top: 40px; background-color: #ffffff; }
        .diagram-container { display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Sequence Diagram: Calon Siswa (2. Proses Login)</h2>
    <div class="diagram-container">
        <svg width="950" height="530" viewBox="0 0 950 530" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">
            <defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="black"/></marker></defs>

            <rect x="60" y="10" width="140" height="35" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="130" y="33" font-size="14" font-weight="bold" text-anchor="middle">Calon Siswa</text>
            <rect x="310" y="10" width="140" height="35" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="380" y="33" font-size="14" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
            <rect x="560" y="10" width="140" height="35" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="630" y="33" font-size="14" font-weight="bold" text-anchor="middle">Google OAuth</text>
            <rect x="760" y="10" width="140" height="35" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="830" y="33" font-size="14" font-weight="bold" text-anchor="middle">Database</text>

            <line x1="130" y1="45" x2="130" y2="500" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
            <line x1="380" y1="45" x2="380" y2="500" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
            <line x1="630" y1="45" x2="630" y2="500" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
            <line x1="830" y1="45" x2="830" y2="500" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>

            <rect x="60" y="500" width="140" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="130" y="520" font-size="13" font-weight="bold" text-anchor="middle">Calon Siswa</text>
            <rect x="310" y="500" width="140" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="380" y="520" font-size="13" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
            <rect x="560" y="500" width="140" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="630" y="520" font-size="13" font-weight="bold" text-anchor="middle">Google OAuth</text>
            <rect x="760" y="500" width="140" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="830" y="520" font-size="13" font-weight="bold" text-anchor="middle">Database</text>

            <line x1="130" y1="80" x2="380" y2="80" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
            <text x="255" y="73" font-size="12" text-anchor="middle">1. Akses halaman login</text>

            <line x1="380" y1="120" x2="130" y2="120" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
            <text x="255" y="113" font-size="12" text-anchor="middle">2. Tampilkan form login</text>

            <!-- Alt: Manual Login -->
            <rect x="25" y="145" width="890" height="150" rx="5" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="8,4"/>
            <rect x="25" y="145" width="130" height="22" fill="white"/><text x="90" y="161" font-size="11" fill="white" text-anchor="middle">alt [Login Manual]</text>

            <line x1="130" y1="180" x2="380" y2="180" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
            <text x="255" y="173" font-size="12" text-anchor="middle">3a. Submit email & password</text>
            <line x1="380" y1="220" x2="830" y2="220" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
            <text x="605" y="213" font-size="12" text-anchor="middle">4a. Verifikasi kredensial</text>
            <line x1="830" y1="260" x2="380" y2="260" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
            <text x="605" y="253" font-size="12" text-anchor="middle">5a. Return valid + data user</text>

            <!-- Alt: Google -->
            <rect x="25" y="305" width="890" height="140" rx="5" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="8,4"/>
            <rect x="25" y="305" width="130" height="22" fill="white"/><text x="90" y="321" font-size="11" fill="white" text-anchor="middle">alt [Login Google]</text>

            <line x1="130" y1="340" x2="380" y2="340" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
            <text x="255" y="333" font-size="12" text-anchor="middle">3b. Klik "Login dengan Google"</text>
            <line x1="380" y1="375" x2="630" y2="375" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
            <text x="505" y="368" font-size="12" text-anchor="middle">4b. Redirect ke Google OAuth</text>
            <line x1="630" y1="410" x2="380" y2="410" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
            <text x="505" y="403" font-size="12" text-anchor="middle">5b. Return callback + token</text>

            <line x1="380" y1="460" x2="130" y2="460" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
            <text x="255" y="453" font-size="12" text-anchor="middle">6. Redirect ke dashboard siswa</text>
        </svg>
    </div>
</body>
</html>
