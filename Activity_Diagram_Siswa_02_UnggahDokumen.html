<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Diagram Calon Siswa - Unggah Dokumen</title>
    <style>
        body { font-family: 'Times New Roman', Times, serif; text-align: center; margin-top: 50px; background-color: #ffffff; }
        .diagram-container { display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Activity Diagram: Calon Siswa (2. Proses Unggah Dokumen)</h2>
    <div class="diagram-container">
        <svg width="800" height="580" viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">
            <rect x="0" y="0" width="800" height="580" fill="none" stroke="black" stroke-width="2"/>
            <line x1="0" y1="60" x2="800" y2="60" stroke="black" stroke-width="2"/>
            <line x1="400" y1="0" x2="400" y2="580" stroke="black" stroke-width="2"/>
            <text x="200" y="38" font-size="18" font-weight="bold" text-anchor="middle">Calon Siswa</text>
            <text x="600" y="38" font-size="18" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
            <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="black" /></marker></defs>

            <!-- Nodes -->
            <circle cx="200" cy="110" r="16" fill="black"/>
            
            <rect x="50" y="170" width="300" height="40" rx="20" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="200" y="195" font-size="14" text-anchor="middle">Pilih Menu Unggah Dokumen</text>
            
            <rect x="50" y="250" width="300" height="40" rx="20" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="200" y="275" font-size="14" text-anchor="middle">Unggah File (KK, Ijazah, dll)</text>

            <polygon points="600,330 660,360 600,390 540,360" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="600" y="365" font-size="14" text-anchor="middle">Format Sesuai?</text>
            <text x="590" y="405" font-size="12">Ya</text>
            <text x="670" y="355" font-size="12">Tidak</text>
            
            <rect x="450" y="440" width="300" height="40" rx="20" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="600" y="465" font-size="14" text-anchor="middle">Simpan Dokumen ke Sistem</text>

            <circle cx="600" cy="530" r="14" fill="white" stroke="black" stroke-width="2"/>
            <circle cx="600" cy="530" r="8" fill="black"/>

            <!-- Arrows -->
            <line x1="200" y1="126" x2="200" y2="170" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <line x1="200" y1="210" x2="200" y2="250" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <path d="M 200 290 L 200 360 L 540 360" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <!-- Tidak -->
            <path d="M 660 360 L 750 360 L 750 270 L 350 270" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <!-- Ya -->
            <line x1="600" y1="390" x2="600" y2="440" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <line x1="600" y1="480" x2="600" y2="516" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
        </svg>
    </div>
</body>
</html>
