<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence Diagram - Publik</title>
    <style>
        body { font-family: 'Times New Roman', Times, serif; text-align: center; margin: 30px; background-color: #fff; }
        h2 { margin-bottom: 10px; }
        .diagram-container { display: inline-block; margin: 20px 0; }
        @media print { body { margin: 0; } }
    </style>
</head>
<body>

<h2>Sequence Diagram: Publik (Pengunjung)</h2>
<p style="margin-bottom:30px;">Menggambarkan alur interaksi pengunjung umum dengan sistem PPDB.</p>

<!-- 1. Lihat Beranda -->
<h3>1. Melihat Halaman Beranda</h3>
<div class="diagram-container">
<svg width="850" height="320" viewBox="0 0 850 320" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">
    <defs><marker id="d1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="black"/></marker></defs>
    <rect x="80" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="140" y="30" font-size="13" font-weight="bold" text-anchor="middle">Publik</text>
    <line x1="140" y1="40" x2="140" y2="300" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="330" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="390" y="30" font-size="13" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
    <line x1="390" y1="40" x2="390" y2="300" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="580" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="640" y="30" font-size="13" font-weight="bold" text-anchor="middle">Database</text>
    <line x1="640" y1="40" x2="640" y2="300" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>

    <line x1="140" y1="80" x2="390" y2="80" stroke="black" stroke-width="1.5" marker-end="url(#d1)"/>
    <text x="265" y="75" font-size="12" text-anchor="middle">1. Akses landing page PPDB</text>
    <line x1="390" y1="120" x2="640" y2="120" stroke="black" stroke-width="1.5" marker-end="url(#d1)"/>
    <text x="515" y="115" font-size="12" text-anchor="middle">2. Get info sekolah, kuota & jadwal</text>
    <line x1="640" y1="160" x2="390" y2="160" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#d1)"/>
    <text x="515" y="155" font-size="12" text-anchor="middle">3. Return data landing page</text>
    <line x1="390" y1="200" x2="140" y2="200" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#d1)"/>
    <text x="265" y="195" font-size="12" text-anchor="middle">4. Tampilkan halaman utama</text>

    <!-- Opt -->
    <rect x="30" y="220" width="470" height="70" rx="5" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="8,4"/>
    <rect x="30" y="220" width="160" height="22" fill="white"/><text x="110" y="236" font-size="11" fill="white" text-anchor="middle">opt [Ingin Mendaftar]</text>
    <line x1="140" y1="260" x2="390" y2="260" stroke="black" stroke-width="1.5" marker-end="url(#d1)"/>
    <text x="265" y="255" font-size="12" text-anchor="middle">5. Klik "Daftar Sekarang"</text>
    <line x1="390" y1="280" x2="140" y2="280" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#d1)"/>
    <text x="265" y="297" font-size="12" text-anchor="middle">6. Redirect ke halaman registrasi</text>
</svg>
</div>

<!-- 2. Lihat Informasi -->
<h3>2. Melihat Informasi Sekolah</h3>
<div class="diagram-container">
<svg width="850" height="320" viewBox="0 0 850 320" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">
    <defs><marker id="d2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="black"/></marker></defs>
    <rect x="80" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="140" y="30" font-size="13" font-weight="bold" text-anchor="middle">Publik</text>
    <line x1="140" y1="40" x2="140" y2="300" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="330" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="390" y="30" font-size="13" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
    <line x1="390" y1="40" x2="390" y2="300" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="580" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="640" y="30" font-size="13" font-weight="bold" text-anchor="middle">Database</text>
    <line x1="640" y1="40" x2="640" y2="300" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>

    <line x1="140" y1="80" x2="390" y2="80" stroke="black" stroke-width="1.5" marker-end="url(#d2)"/>
    <text x="265" y="75" font-size="12" text-anchor="middle">1. Akses halaman profil sekolah</text>
    <line x1="390" y1="120" x2="640" y2="120" stroke="black" stroke-width="1.5" marker-end="url(#d2)"/>
    <text x="515" y="115" font-size="12" text-anchor="middle">2. Get data profil & konten</text>
    <line x1="640" y1="160" x2="390" y2="160" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#d2)"/>
    <text x="515" y="155" font-size="12" text-anchor="middle">3. Return data konten</text>
    <line x1="390" y1="200" x2="140" y2="200" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#d2)"/>
    <text x="265" y="195" font-size="12" text-anchor="middle">4. Tampilkan profil sekolah</text>
    <line x1="140" y1="240" x2="390" y2="240" stroke="black" stroke-width="1.5" marker-end="url(#d2)"/>
    <text x="265" y="235" font-size="12" text-anchor="middle">5. Akses kegiatan/prestasi/berita</text>
    <line x1="390" y1="280" x2="140" y2="280" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#d2)"/>
    <text x="265" y="275" font-size="12" text-anchor="middle">6. Tampilkan halaman informasi</text>
</svg>
</div>

<!-- 3. Lihat Pengumuman -->
<h3>3. Melihat Pengumuman Kelulusan</h3>
<div class="diagram-container">
<svg width="850" height="280" viewBox="0 0 850 280" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">
    <defs><marker id="d3" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="black"/></marker></defs>
    <rect x="80" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="140" y="30" font-size="13" font-weight="bold" text-anchor="middle">Publik</text>
    <line x1="140" y1="40" x2="140" y2="260" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="330" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="390" y="30" font-size="13" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
    <line x1="390" y1="40" x2="390" y2="260" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="580" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="640" y="30" font-size="13" font-weight="bold" text-anchor="middle">Database</text>
    <line x1="640" y1="40" x2="640" y2="260" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>

    <line x1="140" y1="80" x2="390" y2="80" stroke="black" stroke-width="1.5" marker-end="url(#d3)"/>
    <text x="265" y="75" font-size="12" text-anchor="middle">1. Akses halaman pengumuman</text>
    <line x1="390" y1="120" x2="640" y2="120" stroke="black" stroke-width="1.5" marker-end="url(#d3)"/>
    <text x="515" y="115" font-size="12" text-anchor="middle">2. Get data hasil seleksi (public)</text>
    <line x1="640" y1="160" x2="390" y2="160" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#d3)"/>
    <text x="515" y="155" font-size="12" text-anchor="middle">3. Return data siswa diterima</text>
    <line x1="390" y1="200" x2="140" y2="200" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#d3)"/>
    <text x="265" y="195" font-size="12" text-anchor="middle">4. Tampilkan daftar siswa diterima</text>
    <line x1="140" y1="240" x2="390" y2="240" stroke="black" stroke-width="1.5" marker-end="url(#d3)"/>
    <text x="265" y="235" font-size="12" text-anchor="middle">5. Cari nama siswa (opsional)</text>
</svg>
</div>

</body>
</html>
