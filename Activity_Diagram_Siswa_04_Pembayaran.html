<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Diagram Calon Siswa - Pembayaran</title>
    <style>
        body { font-family: 'Times New Roman', Times, serif; text-align: center; margin-top: 50px; background-color: #ffffff; }
        .diagram-container { display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Activity Diagram: Calon Siswa (4. Pembayaran Pendaftaran)</h2>
    <div class="diagram-container">
        <svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">
            <rect x="0" y="0" width="800" height="600" fill="none" stroke="black" stroke-width="2"/>
            <line x1="0" y1="60" x2="800" y2="60" stroke="black" stroke-width="2"/>
            <line x1="400" y1="0" x2="400" y2="600" stroke="black" stroke-width="2"/>
            <text x="200" y="38" font-size="18" font-weight="bold" text-anchor="middle">Calon Siswa</text>
            <text x="600" y="38" font-size="18" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
            <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="black" /></marker></defs>

            <circle cx="200" cy="110" r="16" fill="black"/>
            
            <rect x="60" y="170" width="280" height="40" rx="20" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="200" y="195" font-size="14" text-anchor="middle">Pilih Menu Pembayaran</text>
            
            <rect x="460" y="250" width="280" height="40" rx="20" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="600" y="275" font-size="14" text-anchor="middle">Tampilkan Tagihan &amp; Opsi Bayar</text>

            <rect x="60" y="330" width="280" height="40" rx="20" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="200" y="355" font-size="14" text-anchor="middle">Lakukan Pembayaran (Midtrans/Manual)</text>

            <polygon points="600,400 660,430 600,460 540,430" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="600" y="435" font-size="14" text-anchor="middle">Lunas?</text>
            <text x="635" y="415" font-size="12">Ya</text>
            <text x="670" y="425" font-size="12">Tidak</text>

            <rect x="420" y="510" width="300" height="40" rx="20" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="570" y="535" font-size="14" text-anchor="middle">Update Status Pendaftaran Selesai</text>
            
            <circle cx="600" cy="580" r="14" fill="white" stroke="black" stroke-width="2"/>
            <circle cx="600" cy="580" r="8" fill="black"/>
            
            <line x1="200" y1="126" x2="200" y2="170" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <path d="M 340 190 L 600 190 L 600 250" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <path d="M 460 270 L 200 270 L 200 330" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <path d="M 340 350 L 600 350 L 600 400" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <path d="M 540 430 L 500 430 L 500 510" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <path d="M 660 430 L 750 430 L 750 350 L 340 350" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <line x1="600" y1="550" x2="600" y2="566" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
        </svg>
    </div>
</body>
</html>
