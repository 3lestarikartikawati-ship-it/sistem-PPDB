<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowmap PPDB (Swimlane Diagram)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f4f4; 
            color: #000;
            padding: 20px;
        }
        .container {
            max-width: 1040px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        svg { display: block; margin: 0 auto; }
        @media print {
            body { background: #fff; padding: 0; }
            .container { box-shadow: none; max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Flowmap (Swimlane Diagram) Sistem PPDB</h1>
    
    <svg width="1000" height="1150" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
            </marker>
        </defs>

        <!-- Swimlane Backgrounds & Borders -->
        <rect x="0" y="0" width="1000" height="1150" fill="none" stroke="#000" stroke-width="2"/>
        <line x1="250" y1="0" x2="250" y2="1150" stroke="#000" stroke-width="2"/>
        <line x1="500" y1="0" x2="500" y2="1150" stroke="#000" stroke-width="2"/>
        <line x1="750" y1="0" x2="750" y2="1150" stroke="#000" stroke-width="2"/>
        <line x1="0" y1="50" x2="1000" y2="50" stroke="#000" stroke-width="2"/>

        <!-- Column Headers -->
        <rect x="0" y="0" width="250" height="50" fill="#e0e0e0"/>
        <rect x="250" y="0" width="250" height="50" fill="#f0f0f0"/>
        <rect x="500" y="0" width="250" height="50" fill="#e0e0e0"/>
        <rect x="750" y="0" width="250" height="50" fill="#f0f0f0"/>
        
        <text x="125" y="32" text-anchor="middle" font-size="16" font-weight="bold">CALON SISWA</text>
        <text x="375" y="32" text-anchor="middle" font-size="16" font-weight="bold">SISTEM PPDB</text>
        <text x="625" y="32" text-anchor="middle" font-size="16" font-weight="bold">ADMINISTRATOR</text>
        <text x="875" y="32" text-anchor="middle" font-size="16" font-weight="bold">BENDAHARA</text>

        <!-- ============================================== -->
        <!-- ROW 1: START & Pendaftaran                     -->
        <!-- ============================================== -->
        <ellipse cx="125" cy="90" rx="40" ry="20" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="125" y="95" text-anchor="middle" font-size="12" font-weight="bold">START</text>
        
        <line x1="125" y1="110" x2="125" y2="140" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
        
        <!-- Node 1: Isi Formulir -->
        <rect x="35" y="140" width="180" height="50" rx="4" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="125" y="160" text-anchor="middle" font-size="12" font-weight="bold">Isi Formulir</text>
        <text x="125" y="175" text-anchor="middle" font-size="11">Pendaftaran Online</text>

        <line x1="215" y1="165" x2="285" y2="165" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- Node 2: Sistem Simpan Data -->
        <rect x="285" y="140" width="180" height="50" rx="4" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="375" y="160" text-anchor="middle" font-size="12" font-weight="bold">Simpan Data</text>
        <text x="375" y="175" text-anchor="middle" font-size="11">Calon Siswa</text>

        <line x1="375" y1="190" x2="375" y2="245" stroke="#000" stroke-width="2"/>
        <line x1="375" y1="245" x2="555" y2="245" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- ============================================== -->
        <!-- ROW 2: Admin Verifikasi Formulir               -->
        <!-- ============================================== -->
        <!-- Node 3: Decision Verifikasi Formulir (Admin) -->
        <polygon points="625,210 685,250 625,290 565,250" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="625" y="246" text-anchor="middle" font-size="12" font-weight="bold">Verifikasi</text>
        <text x="625" y="260" text-anchor="middle" font-size="12" font-weight="bold">Formulir</text>

        <!-- Revisi Branch (Up and Left) -->
        <line x1="625" y1="210" x2="625" y2="115" stroke="#000" stroke-width="2"/>
        <line x1="625" y1="115" x2="125" y2="115" stroke="#000" stroke-width="2"/>
        <line x1="125" y1="115" x2="125" y2="135" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="590" y="200" text-anchor="middle" font-size="11" font-weight="bold">Revisi</text>

        <!-- Lulus Branch (Down) -->
        <line x1="625" y1="290" x2="625" y2="340" stroke="#000" stroke-width="2"/>
        <line x1="625" y1="340" x2="465" y2="340" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="645" y="315" text-anchor="start" font-size="11" font-weight="bold">Diterima</text>

        <!-- ============================================== -->
        <!-- ROW 3: Sistem Update Status                    -->
        <!-- ============================================== -->
        <!-- Node 4: Sistem Update Status Lulus -->
        <rect x="285" y="315" width="180" height="50" rx="4" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="375" y="335" text-anchor="middle" font-size="12" font-weight="bold">Update Status</text>
        <text x="375" y="350" text-anchor="middle" font-size="11">Kelulusan &amp; Akun</text>

        <line x1="285" y1="340" x2="215" y2="340" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- ============================================== -->
        <!-- ROW 4: Daftar Ulang                            -->
        <!-- ============================================== -->
        <!-- Node 5: Siswa Daftar Ulang & Upload -->
        <rect x="35" y="315" width="180" height="60" rx="4" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="125" y="335" text-anchor="middle" font-size="12" font-weight="bold">Cek Pengumuman</text>
        <text x="125" y="350" text-anchor="middle" font-size="11">&amp; Upload Berkas</text>
        <text x="125" y="365" text-anchor="middle" font-size="11">Daftar Ulang</text>

        <line x1="125" y1="375" x2="125" y2="435" stroke="#000" stroke-width="2"/>
        <line x1="125" y1="435" x2="285" y2="435" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- Node 6: Sistem Simpan Berkas -->
        <rect x="285" y="410" width="180" height="50" rx="4" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="375" y="430" text-anchor="middle" font-size="12" font-weight="bold">Simpan Berkas</text>
        <text x="375" y="445" text-anchor="middle" font-size="11">Daftar Ulang</text>

        <line x1="375" y1="460" x2="375" y2="520" stroke="#000" stroke-width="2"/>
        <line x1="375" y1="520" x2="555" y2="520" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- ============================================== -->
        <!-- ROW 5: Admin Verifikasi DU                     -->
        <!-- ============================================== -->
        <!-- Node 7: Decision Verifikasi Daftar Ulang (Admin) -->
        <polygon points="625,485 685,525 625,565 565,525" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="625" y="521" text-anchor="middle" font-size="12" font-weight="bold">Verifikasi</text>
        <text x="625" y="535" text-anchor="middle" font-size="12" font-weight="bold">Daftar Ulang</text>

        <!-- Revisi Branch DU (Up and Left) -->
        <line x1="625" y1="485" x2="625" y2="400" stroke="#000" stroke-width="2"/>
        <line x1="625" y1="400" x2="125" y2="400" stroke="#000" stroke-width="2"/>
        <line x1="125" y1="400" x2="125" y2="380" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="585" y="475" text-anchor="middle" font-size="11" font-weight="bold">Revisi</text>

        <!-- Lengkap Branch (Down) -->
        <line x1="625" y1="565" x2="625" y2="615" stroke="#000" stroke-width="2"/>
        <line x1="625" y1="615" x2="465" y2="615" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="645" y="590" text-anchor="start" font-size="11" font-weight="bold">Lengkap</text>

        <!-- ============================================== -->
        <!-- ROW 6: Siswa Aktif & Sistem                    -->
        <!-- ============================================== -->
        <!-- Node 8: Sistem Update Siswa Aktif -->
        <rect x="285" y="590" width="180" height="50" rx="4" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="375" y="610" text-anchor="middle" font-size="12" font-weight="bold">Jadikan Data</text>
        <text x="375" y="625" text-anchor="middle" font-size="11">Siswa Aktif</text>

        <line x1="375" y1="640" x2="375" y2="700" stroke="#000" stroke-width="2"/>
        <line x1="375" y1="700" x2="785" y2="700" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- ============================================== -->
        <!-- ROW 7: Bendahara                               -->
        <!-- ============================================== -->
        <!-- Node 9: Bendahara Input Pembayaran -->
        <rect x="785" y="675" width="180" height="50" rx="4" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="875" y="695" text-anchor="middle" font-size="12" font-weight="bold">Kelola &amp; Input</text>
        <text x="875" y="710" text-anchor="middle" font-size="11">Pembayaran Siswa</text>

        <line x1="875" y1="725" x2="875" y2="785" stroke="#000" stroke-width="2"/>
        <line x1="875" y1="785" x2="465" y2="785" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- ============================================== -->
        <!-- ROW 8: Sistem & Siswa Cetak                    -->
        <!-- ============================================== -->
        <!-- Node 10: Sistem Rekam Transaksi -->
        <rect x="285" y="760" width="180" height="50" rx="4" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="375" y="780" text-anchor="middle" font-size="12" font-weight="bold">Rekam Transaksi</text>
        <text x="375" y="795" text-anchor="middle" font-size="11">&amp; Tampilkan Saldo</text>

        <line x1="285" y1="785" x2="215" y2="785" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- Node 11: Siswa Cetak Bukti -->
        <rect x="35" y="760" width="180" height="50" rx="4" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="125" y="780" text-anchor="middle" font-size="12" font-weight="bold">Cetak Bukti Pendaftaran</text>
        <text x="125" y="795" text-anchor="middle" font-size="11">&amp; Riwayat Bayar</text>

        <line x1="125" y1="810" x2="125" y2="870" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- ============================================== -->
        <!-- ROW 9: FINISH                                  -->
        <!-- ============================================== -->
        <ellipse cx="125" cy="890" rx="40" ry="20" fill="#fff" stroke="#000" stroke-width="2"/>
        <text x="125" y="895" text-anchor="middle" font-size="12" font-weight="bold">FINISH</text>

    </svg>
</div>

</body>
</html>
