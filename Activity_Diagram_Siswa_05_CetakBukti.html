<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Diagram Calon Siswa - Cetak Bukti</title>
    <style>
        body { font-family: 'Times New Roman', Times, serif; text-align: center; margin-top: 50px; background-color: #ffffff; }
        .diagram-container { display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Activity Diagram: Calon Siswa (5. Cetak Bukti Pendaftaran)</h2>
    <div class="diagram-container">
        <svg width="800" height="550" viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">
            <rect x="0" y="0" width="800" height="550" fill="none" stroke="black" stroke-width="2"/>
            <line x1="0" y1="60" x2="800" y2="60" stroke="black" stroke-width="2"/>
            <line x1="400" y1="0" x2="400" y2="550" stroke="black" stroke-width="2"/>
            <text x="200" y="38" font-size="18" font-weight="bold" text-anchor="middle">Calon Siswa</text>
            <text x="600" y="38" font-size="18" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
            <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="black" /></marker></defs>

            <circle cx="200" cy="110" r="16" fill="black"/>
            
            <rect x="60" y="170" width="280" height="40" rx="20" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="200" y="195" font-size="14" text-anchor="middle">Pilih Menu Cetak Bukti Pendaftaran</text>
            
            <polygon points="600,220 660,250 600,280 540,250" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="600" y="255" font-size="14" text-anchor="middle">Sudah Lulus?</text>
            <text x="540" y="295" font-size="12">Ya</text>
            <text x="670" y="245" font-size="12">Tidak</text>

            <rect x="620" y="340" width="160" height="40" rx="20" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="700" y="365" font-size="14" text-anchor="middle">Tampil Peringatan</text>

            <rect x="420" y="340" width="160" height="40" rx="20" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="500" y="365" font-size="14" text-anchor="middle">Generate File PDF</text>

            <circle cx="700" cy="420" r="14" fill="white" stroke="black" stroke-width="2"/>
            <circle cx="700" cy="420" r="8" fill="black"/>
            
            <circle cx="500" cy="420" r="14" fill="white" stroke="black" stroke-width="2"/>
            <circle cx="500" cy="420" r="8" fill="black"/>

            <line x1="200" y1="126" x2="200" y2="170" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <path d="M 340" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <path d="M 340 190 L 600 190 L 600 220" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <path d="M 660 250 L 700 250 L 700 340" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <path d="M 540 250 L 500 250 L 500 340" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <line x1="700" y1="380" x2="700" y2="406" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
            <line x1="500" y1="380" x2="500" y2="406" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
        </svg>
    </div>
</body>
</html>
