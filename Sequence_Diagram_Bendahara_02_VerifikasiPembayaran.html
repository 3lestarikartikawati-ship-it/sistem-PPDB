<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence Diagram Bendahara - Verifikasi Pembayaran</title>
    <style>
        body { font-family: 'Times New Roman', Times, serif; text-align: center; margin-top: 40px; background-color: #ffffff; }
        .diagram-container { display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Sequence Diagram: Bendahara (2. Verifikasi Pembayaran)</h2>
    <div class="diagram-container">
        <svg width="850" height="540" viewBox="0 0 850 540" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">
            <defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="black"/></marker></defs>

            <!-- Actors Top -->
            <rect x="60" y="10" width="140" height="35" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="130" y="33" font-size="14" font-weight="bold" text-anchor="middle">Bendahara</text>
            <rect x="310" y="10" width="140" height="35" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="380" y="33" font-size="14" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
            <rect x="570" y="10" width="140" height="35" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="640" y="33" font-size="14" font-weight="bold" text-anchor="middle">Database</text>

            <!-- Lifelines -->
            <line x1="130" y1="45" x2="130" y2="510" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
            <line x1="380" y1="45" x2="380" y2="510" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
            <line x1="640" y1="45" x2="640" y2="510" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>

            <!-- Actors Bottom -->
            <rect x="60" y="510" width="140" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="130" y="530" font-size="13" font-weight="bold" text-anchor="middle">Bendahara</text>
            <rect x="310" y="510" width="140" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="380" y="530" font-size="13" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
            <rect x="570" y="510" width="140" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="640" y="530" font-size="13" font-weight="bold" text-anchor="middle">Database</text>

            <!-- Messages -->
            <line x1="130" y1="80" x2="380" y2="80" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
            <text x="255" y="73" font-size="12" text-anchor="middle">1. Akses menu transaksi pembayaran</text>

            <line x1="380" y1="120" x2="640" y2="120" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
            <text x="510" y="113" font-size="12" text-anchor="middle">2. Get list transaksi pembayaran</text>

            <line x1="640" y1="160" x2="380" y2="160" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
            <text x="510" y="153" font-size="12" text-anchor="middle">3. Return data transaksi</text>

            <line x1="380" y1="200" x2="130" y2="200" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
            <text x="255" y="193" font-size="12" text-anchor="middle">4. Tampilkan tabel transaksi</text>

            <!-- Opt Frame -->
            <rect x="25" y="230" width="700" height="150" rx="0" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="8,4"/>
            <rect x="25" y="230" width="160" height="22" fill="white" stroke="black" stroke-width="1.5"/>
            <text x="105" y="245" font-size="11" fill="black" text-anchor="middle">opt [Verifikasi Manual]</text>

            <line x1="130" y1="280" x2="380" y2="280" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
            <text x="255" y="273" font-size="12" text-anchor="middle">5. Klik verifikasi manual pembayaran</text>
            
            <line x1="380" y1="320" x2="640" y2="320" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
            <text x="510" y="313" font-size="12" text-anchor="middle">6. Update status = Lunas</text>
            
            <line x1="640" y1="360" x2="380" y2="360" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
            <text x="510" y="353" font-size="12" text-anchor="middle">7. Konfirmasi berhasil</text>

            <line x1="380" y1="430" x2="130" y2="430" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
            <text x="255" y="423" font-size="12" text-anchor="middle">8. Notifikasi status diperbarui</text>
        </svg>
    </div>
</body>
</html>
