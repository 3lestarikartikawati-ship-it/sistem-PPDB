<!DOCTYPE html>

<h2>Sequence Diagram: Calon Siswa</h2>
<p style="margin-bottom:30px;">Menggambarkan alur interaksi calon siswa dengan sistem PPDB secara keseluruhan.</p>

    <rect x="580" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="640" y="30" font-size="13" font-weight="bold" text-anchor="middle">Database</text>
    <line x1="640" y1="40" x2="640" y2="500" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>

    <text x="640" y="520" font-size="13" font-weight="bold" text-anchor="middle">Database</text>

    <text x="265" y="65" font-size="12" text-anchor="middle">1. Akses halaman registrasi</text>
    <!-- 2 -->

    <text x="265" y="105" font-size="12" text-anchor="middle">2. Tampilkan form registrasi</text>
    <!-- 3 -->
    <line x1="140" y1="150" x2="390" y2="150" stroke="black" stroke-width="1.5" marker-end="url(#a1)"/>
    <text x="265" y="145" font-size="12" text-anchor="middle">3. Submit (nama, email, password, jalur)</text>
    <!-- 4 -->
    <line x1="390" y1="190" x2="640" y2="190" stroke="black" stroke-width="1.5" marker-end="url(#a1)"/>

    <text x="515" y="375" font-size="12" text-anchor="middle">8. Verifikasi kredensial</text>
    <!-- 9 -->
    <line x1="640" y1="420" x2="390" y2="420" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a1)"/>
    <text x="515" y="415" font-size="12" text-anchor="middle">9. Return valid + token</text>
    <!-- 10 -->
    <line x1="390" y1="460" x2="140" y2="460" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a1)"/>
    <text x="265" y="455" font-size="12" text-anchor="middle">10. Tampilkan dashboard siswa</text>
</svg>
</div>

<!-- 2. Pengisian Biodata & Upload Dokumen -->

<div class="diagram-container">
<svg width="850" height="520" viewBox="0 0 850 520" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">

    <rect x="80" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>

    <!-- 5 -->
    <line x1="640" y1="230" x2="390" y2="230" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a2)"/>
    <text x="515" y="225" font-size="12" text-anchor="middle">5. Konfirmasi tersimpan</text>

    <!-- Upload -->

    <text x="515" y="375" font-size="12" text-anchor="middle">8. Simpan file & path dokumen</text>
    <line x1="640" y1="420" x2="390" y2="420" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a2)"/>
