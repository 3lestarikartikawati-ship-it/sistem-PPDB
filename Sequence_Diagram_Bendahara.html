<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence Diagram - Bendahara</title>
    <style>
        body { font-family: 'Times New Roman', Times, serif; text-align: center; margin: 30px; background-color: #fff; }
        h2 { margin-bottom: 10px; }
        .diagram-container { display: inline-block; margin: 20px 0; }
        @media print { body { margin: 0; } }
    </style>
</head>
<body>

<h2>Sequence Diagram: Bendahara</h2>
<p style="margin-bottom:30px;">Menggambarkan alur interaksi bendahara dengan sistem PPDB.</p>

<!-- 1. Login Bendahara -->
<h3>1. Proses Login Bendahara</h3>
<div class="diagram-container">
<svg width="850" height="360" viewBox="0 0 850 360" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">
    <defs><marker id="c1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="black"/></marker></defs>
    <rect x="80" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="140" y="30" font-size="13" font-weight="bold" text-anchor="middle">Bendahara</text>
    <line x1="140" y1="40" x2="140" y2="340" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="330" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="390" y="30" font-size="13" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
    <line x1="390" y1="40" x2="390" y2="340" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="580" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="640" y="30" font-size="13" font-weight="bold" text-anchor="middle">Database</text>
    <line x1="640" y1="40" x2="640" y2="340" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>

    <line x1="140" y1="80" x2="390" y2="80" stroke="black" stroke-width="1.5" marker-end="url(#c1)"/>
    <text x="265" y="75" font-size="12" text-anchor="middle">1. Akses halaman login</text>
    <line x1="390" y1="120" x2="140" y2="120" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c1)"/>
    <text x="265" y="115" font-size="12" text-anchor="middle">2. Tampilkan form login</text>
    <line x1="140" y1="160" x2="390" y2="160" stroke="black" stroke-width="1.5" marker-end="url(#c1)"/>
    <text x="265" y="155" font-size="12" text-anchor="middle">3. Submit email & password</text>
    <line x1="390" y1="200" x2="640" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#c1)"/>
    <text x="515" y="195" font-size="12" text-anchor="middle">4. Verifikasi kredensial (role=bendahara)</text>
    <line x1="640" y1="240" x2="390" y2="240" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c1)"/>
    <text x="515" y="235" font-size="12" text-anchor="middle">5. Return valid + session</text>
    <line x1="390" y1="280" x2="140" y2="280" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c1)"/>
    <text x="265" y="275" font-size="12" text-anchor="middle">6. Redirect ke dashboard bendahara</text>
</svg>
</div>

<!-- 2. Verifikasi Pembayaran -->
<h3>2. Verifikasi Pembayaran</h3>
<div class="diagram-container">
<svg width="850" height="480" viewBox="0 0 850 480" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">
    <defs><marker id="c2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="black"/></marker></defs>
    <rect x="80" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="140" y="30" font-size="13" font-weight="bold" text-anchor="middle">Bendahara</text>
    <line x1="140" y1="40" x2="140" y2="460" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="330" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="390" y="30" font-size="13" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
    <line x1="390" y1="40" x2="390" y2="460" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="580" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="640" y="30" font-size="13" font-weight="bold" text-anchor="middle">Database</text>
    <line x1="640" y1="40" x2="640" y2="460" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>

    <line x1="140" y1="80" x2="390" y2="80" stroke="black" stroke-width="1.5" marker-end="url(#c2)"/>
    <text x="265" y="75" font-size="12" text-anchor="middle">1. Akses menu transaksi pembayaran</text>
    <line x1="390" y1="120" x2="640" y2="120" stroke="black" stroke-width="1.5" marker-end="url(#c2)"/>
    <text x="515" y="115" font-size="12" text-anchor="middle">2. Get list transaksi pembayaran</text>
    <line x1="640" y1="160" x2="390" y2="160" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c2)"/>
    <text x="515" y="155" font-size="12" text-anchor="middle">3. Return data transaksi</text>
    <line x1="390" y1="200" x2="140" y2="200" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c2)"/>
    <text x="265" y="195" font-size="12" text-anchor="middle">4. Tampilkan tabel transaksi</text>

    <!-- Opt -->
    <rect x="30" y="220" width="720" height="140" rx="5" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="8,4"/>
    <rect x="30" y="220" width="160" height="22" fill="white"/><text x="110" y="236" font-size="11" fill="white" text-anchor="middle">opt [Verifikasi Manual]</text>

    <line x1="140" y1="260" x2="390" y2="260" stroke="black" stroke-width="1.5" marker-end="url(#c2)"/>
    <text x="265" y="255" font-size="12" text-anchor="middle">5. Klik verifikasi manual pembayaran</text>
    <line x1="390" y1="300" x2="640" y2="300" stroke="black" stroke-width="1.5" marker-end="url(#c2)"/>
    <text x="515" y="295" font-size="12" text-anchor="middle">6. Update status = Lunas</text>
    <line x1="640" y1="340" x2="390" y2="340" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c2)"/>
    <text x="515" y="335" font-size="12" text-anchor="middle">7. Konfirmasi berhasil</text>

    <line x1="390" y1="400" x2="140" y2="400" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c2)"/>
    <text x="265" y="395" font-size="12" text-anchor="middle">8. Notifikasi status diperbarui</text>
</svg>
</div>

<!-- 3. Kelola Rincian Biaya -->
<h3>3. Kelola Rincian Biaya (Payment Items)</h3>
<div class="diagram-container">
<svg width="850" height="400" viewBox="0 0 850 400" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">
    <defs><marker id="c3" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="black"/></marker></defs>
    <rect x="80" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="140" y="30" font-size="13" font-weight="bold" text-anchor="middle">Bendahara</text>
    <line x1="140" y1="40" x2="140" y2="380" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="330" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="390" y="30" font-size="13" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
    <line x1="390" y1="40" x2="390" y2="380" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="580" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="640" y="30" font-size="13" font-weight="bold" text-anchor="middle">Database</text>
    <line x1="640" y1="40" x2="640" y2="380" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>

    <line x1="140" y1="80" x2="390" y2="80" stroke="black" stroke-width="1.5" marker-end="url(#c3)"/>
    <text x="265" y="75" font-size="12" text-anchor="middle">1. Akses menu rincian biaya</text>
    <line x1="390" y1="120" x2="640" y2="120" stroke="black" stroke-width="1.5" marker-end="url(#c3)"/>
    <text x="515" y="115" font-size="12" text-anchor="middle">2. Get list item biaya per jalur</text>
    <line x1="640" y1="160" x2="390" y2="160" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c3)"/>
    <text x="515" y="155" font-size="12" text-anchor="middle">3. Return data payment items</text>
    <line x1="390" y1="200" x2="140" y2="200" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c3)"/>
    <text x="265" y="195" font-size="12" text-anchor="middle">4. Tampilkan tabel rincian biaya</text>
    <line x1="140" y1="240" x2="390" y2="240" stroke="black" stroke-width="1.5" marker-end="url(#c3)"/>
    <text x="265" y="235" font-size="12" text-anchor="middle">5. Tambah/Edit/Hapus item biaya</text>
    <line x1="390" y1="280" x2="640" y2="280" stroke="black" stroke-width="1.5" marker-end="url(#c3)"/>
    <text x="515" y="275" font-size="12" text-anchor="middle">6. CRUD data payment items</text>
    <line x1="640" y1="320" x2="390" y2="320" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c3)"/>
    <text x="515" y="315" font-size="12" text-anchor="middle">7. Konfirmasi berhasil</text>
    <line x1="390" y1="360" x2="140" y2="360" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c3)"/>
    <text x="265" y="355" font-size="12" text-anchor="middle">8. Notifikasi item diperbarui</text>
</svg>
</div>

<!-- 4. Export Laporan -->
<h3>4. Export Laporan Keuangan</h3>
<div class="diagram-container">
<svg width="850" height="400" viewBox="0 0 850 400" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">
    <defs><marker id="c4" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="black"/></marker></defs>
    <rect x="80" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="140" y="30" font-size="13" font-weight="bold" text-anchor="middle">Bendahara</text>
    <line x1="140" y1="40" x2="140" y2="380" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="330" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="390" y="30" font-size="13" font-weight="bold" text-anchor="middle">Sistem PPDB</text>
    <line x1="390" y1="40" x2="390" y2="380" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="580" y="10" width="120" height="30" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="640" y="30" font-size="13" font-weight="bold" text-anchor="middle">Database</text>
    <line x1="640" y1="40" x2="640" y2="380" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>

    <line x1="140" y1="80" x2="390" y2="80" stroke="black" stroke-width="1.5" marker-end="url(#c4)"/>
    <text x="265" y="75" font-size="12" text-anchor="middle">1. Akses menu laporan keuangan</text>
    <line x1="140" y1="120" x2="390" y2="120" stroke="black" stroke-width="1.5" marker-end="url(#c4)"/>
    <text x="265" y="115" font-size="12" text-anchor="middle">2. Filter berdasarkan tanggal/jalur</text>
    <line x1="390" y1="160" x2="640" y2="160" stroke="black" stroke-width="1.5" marker-end="url(#c4)"/>
    <text x="515" y="155" font-size="12" text-anchor="middle">3. Get rekap keuangan sesuai filter</text>
    <line x1="640" y1="200" x2="390" y2="200" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c4)"/>
    <text x="515" y="195" font-size="12" text-anchor="middle">4. Return data rekap</text>
    <line x1="390" y1="240" x2="140" y2="240" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c4)"/>
    <text x="265" y="235" font-size="12" text-anchor="middle">5. Tampilkan laporan keuangan</text>
    <line x1="140" y1="280" x2="390" y2="280" stroke="black" stroke-width="1.5" marker-end="url(#c4)"/>
    <text x="265" y="275" font-size="12" text-anchor="middle">6. Klik export (PDF/CSV)</text>
    <rect x="320" y="300" width="140" height="25" rx="5" fill="white" stroke="black" stroke-width="1"/>
    <text x="390" y="317" font-size="11" text-anchor="middle">Generate file laporan</text>
    <line x1="390" y1="345" x2="140" y2="345" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c4)"/>
    <text x="265" y="340" font-size="12" text-anchor="middle">7. Download file laporan</text>
</svg>
</div>

</body>
</html>
